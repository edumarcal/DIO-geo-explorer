[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-explorer"
version = "0.1.0"
description = "Geo Explorer: trilhas, desafios e certificados fictícios."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
geo-explorer = "geo_explorer.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
